name: Ingest snapshots

# Daily data ingest — runs scripts/refresh-snapshots.ts and commits the
# updated data/snapshots/*.json. This is what makes the historical series
# grow: fee_btc, breadth and btc_dominance are append-only (no free API
# backfill), so without this job they stay frozen at bootstrap length.
#
# Hour chosen off-peak: 05:17 UTC avoids the top-of-hour rush when most
# cron jobs hammer CoinGecko (fewer 429s).
#
# Production alternative (once deployed): replace the script step with a
# POST to https://<site>/api/cron/refresh-heavy with header
# "Authorization: Bearer ${{ secrets.CRON_SECRET }}".

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Refresh + commit snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh heavy snapshots
        run: npm run snapshots:refresh
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes — sources returned identical data."
          else
            git commit -m "data: daily snapshot ingest"
            git push
          fi
