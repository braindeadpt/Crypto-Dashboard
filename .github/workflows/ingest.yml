name: Ingest snapshots

# Data ingest — runs scripts/refresh-snapshots.ts and commits the updated
# data/snapshots/*.json (+ health.json). This is what makes the historical
# series grow: fee_btc, breadth and btc_dominance are append-only (no free
# API backfill), so without this job they stay frozen.
#
# Four runs a day, off the top of the hour (fewer CoinGecko 429s). The
# daily series only append once per UTC day (ingest is idempotent per day);
# the extra runs keep "last good" market/sentiment snapshots fresh (<6h).
#
# Only the default branch runs `schedule` — the default branch MUST be
# `master` (checked in DESENHO-V5 §5). Failures open/update an Issue so a
# dead source is noticed by e-mail, not by a frozen chart weeks later.

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Refresh + commit snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh heavy snapshots
        run: npm run snapshots:refresh
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Validate snapshots
        run: npm run snapshots:validate

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes — sources returned identical data."
            exit 0
          fi
          git commit -m "data: snapshot ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          # master may have moved while we ran; never lose the day's data.
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 10
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Report failure as an Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Ingest falhou"
          body="A ingestão de snapshots falhou em $(date -u +%Y-%m-%dT%H:%MZ). Run: $RUN_URL"
          existing=$(gh issue list --state open --label ingest --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create ingest --color D93F0B --description "Falhas da ingestão automática" 2>/dev/null || true
            gh issue create --title "$title" --label ingest --body "$body"
          fi
